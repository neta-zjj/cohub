<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cohub</title>
    <meta name="application-name" content="Cohub" />
    <meta name="apple-mobile-web-app-title" content="Cohub" />
    <!-- Favicons are set per-route (Work pages use Work icons; others use shell defaults). -->
    <script>
      (() => {
        var segments = location.pathname.split('/').filter(Boolean);
        var isPublicWorkUrl = segments.length === 4 && segments[2] === 'w';
        var href = isPublicWorkUrl
          ? `/work.webmanifest?start_url=${encodeURIComponent(location.pathname)}`
          : '/manifest.webmanifest';
        document.write(`<link rel="manifest" href="${href}" />`);
      })();
    </script>
    <meta name="theme-color" content="#1F2026" />
    <script>
      // Prevent FOUC — resolve theme before first paint
      (() => {
        var themeColors = {
          dark: '#1F2026',
          light: '#F8F8FA',
          'solarized-dark': '#002B36',
          'solarized-light': '#FDF6E3',
          'neta-studio': '#1A191A'
        };
        var stored = localStorage.getItem('cohub-theme');
        var resolved;
        var path = location.pathname;
        // Marketing home is always dark; other public pages follow the visitor theme.
        var isHome = path === '/' || path === '';
        if (isHome) {
          resolved = 'dark';
        } else if (Object.hasOwn(themeColors, stored)) {
          resolved = stored;
        } else if (stored === 'system' || !stored) {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          resolved = 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          themeColors[resolved]
        );

        // Home: if a session may exist, hide marketing before paint (SEO HTML still in DOM).
        var homeHint = false;
        var homeToken = '';
        var homeLogto = false;
        var logtoApps = ['vpikk7sl9zwvefiptowtn', '16ai0wao2mud3xqkbzqo0'];
        var i = 0;
        if (path === '/' || path === '') {
          try {
            homeHint = localStorage.getItem('cohub:session-hint') === '1';
            homeToken = (localStorage.getItem('cohub_token') || '').trim();
            // Official Logto app ids (dev + prod) — residue means a prior session.
            for (i = 0; i < logtoApps.length; i++) {
              if (
                localStorage.getItem(`logto:${logtoApps[i]}:refreshToken`) ||
                localStorage.getItem(`logto:${logtoApps[i]}:idToken`)
              ) {
                homeLogto = true;
                break;
              }
            }
            if (homeHint || homeToken || homeLogto) {
              document.documentElement.setAttribute('data-home-redirect', '1');
            }
          } catch (_error) {}
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
