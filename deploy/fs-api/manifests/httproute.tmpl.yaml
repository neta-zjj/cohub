apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __APP_NAME__-route
  namespace: __NAMESPACE__
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - "__API_HOSTNAME__"
    - "__PREVIEW_HOSTNAME__"
  rules:
    # Space filesystem requests, including checkpoint snapshot browsing, are routed
    # from the main API to this fs-api deployment.
    - matches:
        - path:
            type: RegularExpression
            value: /api/spaces/[^/]+/fs/.*
        - path:
            type: RegularExpression
            value: /api/spaces/[^/]+/checkpoints/[^/]+/fs/.*
        - path:
            type: RegularExpression
            value: /api/spaces/[^/]+/startup
        - path:
            type: PathPrefix
            value: /__session
        - path:
            type: PathPrefix
            value: /s/
      backendRefs:
        - name: __APP_NAME__
          port: __SERVICE_PORT__
